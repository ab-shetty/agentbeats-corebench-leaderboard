name: Run Scenario (Parallel)

on:
  push:
    paths:
      - 'scenario.toml'
  workflow_dispatch:

jobs:
  # First job: determine how many tasks to run
  setup:
    runs-on: ubuntu-latest
    outputs:
      num_tasks: ${{ steps.get_config.outputs.num_tasks }}
      task_indices: ${{ steps.get_config.outputs.task_indices }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tomli

      - name: Get number of tasks from scenario.toml
        id: get_config
        run: |
          python3 << 'EOF'
          import tomli
          import json
          import os
          
          with open('scenario.toml', 'rb') as f:
              data = tomli.load(f)
          
          num_tasks = data.get('config', {}).get('num_tasks', 1)
          task_indices = list(range(num_tasks))
          
          print(f"num_tasks={num_tasks}")
          print(f"task_indices={json.dumps(task_indices)}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"num_tasks={num_tasks}\n")
              f.write(f"task_indices={json.dumps(task_indices)}\n")
          EOF

  # Second job: run each task in parallel
  run-task:
    needs: setup
    # Dynamic runner selection: GPU tasks (0,1,2,3,7,9,19,22) use RunsOn g4dn.xlarge, others use GitHub runners
    runs-on: ${{ contains(fromJson('[0,1,2,3,7,9,19,22]'), matrix.task_index) && format('runs-on,family=g4dn.xlarge,image=ubuntu22-gpu-x64,run-id={0}', github.run_id) || 'ubuntu-latest' }}
    if: github.event.repository.fork == true || github.ref != 'refs/heads/main'
    permissions:
      contents: write
      packages: read
    
    strategy:
      fail-fast: false  # Continue running other tasks even if one fails
      matrix:
        task_index: ${{ fromJson(needs.setup.outputs.task_indices) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tomli tomli-w pyyaml requests

      - name: Generate docker-compose.yml for task ${{ matrix.task_index }}
        run: python generate_compose.py --scenario scenario.toml

      - name: Modify scenario for single task
        run: |
          python3 << 'EOF'
          import tomli
          import tomli_w
          
          # Read the generated a2a-scenario.toml
          with open('a2a-scenario.toml', 'rb') as f:
              data = tomli.load(f)
          
          # Modify to run only one task using task_index
          if 'config' in data:
              # Don't set num_tasks - let task_index handle it
              data['config']['task_index'] = ${{ matrix.task_index }}
              # Remove num_tasks if it exists
              data['config'].pop('num_tasks', None)
          
          # Write back
          with open('a2a-scenario.toml', 'wb') as f:
              tomli_w.dump(data, f)
          EOF

      - name: Pull images
        run: |
          if ! docker compose pull; then
            echo ""
            echo "Error: Failed to pull one or more images."
            echo "Ensure all images are publicly accessible."
            echo "For ghcr.io images, check package settings at:"
            echo "  https://github.com/orgs/YOUR_ORG/packages or"
            echo "  https://github.com/users/YOUR_USER/packages"
            exit 1
          fi

      - name: Create output directory
        run: mkdir -p output && chmod 777 output

      - name: Export secrets as environment variables
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > .env

      - name: Check if GHCR_TOKEN is available
        id: check_ghcr
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        if: steps.check_ghcr.outputs.has_token == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run assessment for task ${{ matrix.task_index }}
        run: docker compose up --timestamps --no-color --exit-code-from agentbeats-client --abort-on-container-exit

      - name: Record provenance
        run: python record_provenance.py --compose docker-compose.yml --output output/provenance.json

      - name: Upload task results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-${{ matrix.task_index }}-results
          path: |
            output/results.json
            output/provenance.json
          retention-days: 1

      - name: Cleanup
        if: always()
        run: docker compose down -v || true

  # Third job: aggregate results and submit
  aggregate-and-submit:
    needs: [setup, run-task]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tomli tomli-w pyyaml requests

      - name: Download all task results
        uses: actions/download-artifact@v4
        with:
          pattern: task-*-results
          path: task-results

      - name: Aggregate results
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          
          # Collect all results
          all_tasks = []
          all_provenances = []
          failed_tasks = []
          
          task_results_dir = Path('task-results')
          
          # Check which tasks we expected
          expected_tasks = set()
          if task_results_dir.exists():
              for task_dir in task_results_dir.glob('task-*-results'):
                  # Extract task index from directory name
                  task_name = task_dir.name
                  if task_name.startswith('task-') and task_name.endswith('-results'):
                      task_idx = task_name[5:-8]  # Extract number between 'task-' and '-results'
                      expected_tasks.add(int(task_idx))
          
          # Collect results from successful tasks - maintain order by task index
          task_dict = {}
          for task_dir in task_results_dir.glob('task-*-results'):
              results_file = task_dir / 'results.json'
              provenance_file = task_dir / 'provenance.json'
              
              task_idx = int(task_dir.name[5:-8])
              
              if results_file.exists():
                  with open(results_file, 'r') as f:
                      task_result = json.load(f)
                      task_dict[task_idx] = task_result
              else:
                  failed_tasks.append(task_idx)
                  print(f"Warning: Task {task_idx} has no results.json")
              
              if provenance_file.exists():
                  with open(provenance_file, 'r') as f:
                      task_provenance = json.load(f)
                      all_provenances.append(task_provenance)
          
          # Sort tasks by index
          all_tasks = [task_dict[i] for i in sorted(task_dict.keys())]
          
          # Generate agent ID
          model_name = None
          for task in all_tasks:
              if 'results' in task and len(task['results']) > 0:
                  result = task['results'][0]
                  if result.get('model_used'):
                      model_name = result['model_used']
                      break
          
          if model_name:
              # Extract model name after last '/'
              model_short = model_name.split('/')[-1]
          else:
              model_short = "unknown"
          
          # Generate timestamp in DDMMYYHHMM format
          timestamp = datetime.now().strftime('%d%m%y%H%M')
          agent_id = f"{model_short}-{timestamp}"
          
          # Calculate metrics
          tasks_passed = 0.0
          total_tasks = len(all_tasks)
          partial_success_score = 0.0
          total_cost = 0.0
          
          orig_passed = 0.0
          orig_partial_success = 0.0
          orig_cost = 0.0
          
          new_passed = 0.0
          new_partial_success = 0.0
          new_cost = 0.0
          
          for idx, task in enumerate(all_tasks):
              if 'results' in task and len(task['results']) > 0:
                  result = task['results'][0]
                  
                  pass_rate = result.get('pass_rate', 0.0)
                  mean_adherence = result.get('mean_adherence', 0.0)
                  cost = result.get('total_cost') or 0.0
                  
                  # Overall metrics
                  tasks_passed += pass_rate
                  if pass_rate == 0.0:
                      partial_success_score += mean_adherence
                  total_cost += cost
                  
                  # Split by task index (0-44 vs 45-65)
                  if idx <= 44:  # First 45 tasks (indices 0-44)
                      orig_passed += pass_rate
                      if pass_rate == 0.0:
                          orig_partial_success += mean_adherence
                      orig_cost += cost
                  elif idx <= 65:  # Next 21 tasks (indices 45-65)
                      new_passed += pass_rate
                      if pass_rate == 0.0:
                          new_partial_success += mean_adherence
                      new_cost += cost
          
          # Calculate scores as percentages
          total_score = round((tasks_passed + partial_success_score) / total_tasks * 100, 2) if total_tasks > 0 else 0
          
          # Calculate orig_score (tasks 0-44)
          orig_total = min(total_tasks, 45)  # Count of tasks in orig range
          orig_score = round((orig_passed + orig_partial_success) / orig_total * 100, 2) if orig_total > 0 else 0
          
          # Calculate new_score (tasks 45-65)
          new_total = max(0, min(total_tasks - 45, 21))  # Count of tasks in new range
          new_score = round((new_passed + new_partial_success) / new_total * 100, 2) if new_total > 0 else 0
          
          # Round costs to 2 decimal places
          total_cost = round(total_cost, 2)
          orig_cost = round(orig_cost, 2)
          new_cost = round(new_cost, 2)
          
          # Create aggregated results in new format
          aggregated = {
              "participants": {
                  "agent": agent_id
              },
              "results": [
                  {
                      "domain": "corebench_hard",
                      "tasks_passed": tasks_passed,
                      "total_tasks": total_tasks,
                      "total_cost": total_cost,
                      "partial_success_score": partial_success_score,
                      "total_score": total_score,
                      "orig_passed": orig_passed,
                      "orig_score": orig_score,
                      "new_passed": new_passed,
                      "new_score": new_score,
                      "orig_cost": orig_cost,
                      "new_cost": new_cost
                  }
              ]
          }
          
          # Write aggregated results
          os.makedirs('output', exist_ok=True)
          with open('output/results.json', 'w') as f:
              json.dump(aggregated, f, indent=2)
          
          # Merge provenances (use the first one, they should all have same images)
          if all_provenances:
              with open('output/provenance.json', 'w') as f:
                  json.dump(all_provenances[0], f, indent=2)
          
          print(f"Aggregated {len(all_tasks)} task results")
          print(f"Agent ID: {agent_id}")
          print(f"Total Score: {total_score}")
          print(f"Total Cost: ${total_cost}")
          if failed_tasks:
              print(f"Failed tasks: {failed_tasks}")
          EOF

      - name: Generate submission metadata
        id: metadata
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          USERNAME=${{ github.repository_owner }}
          UNIQUE_NAME="${USERNAME}-${TIMESTAMP}"
          echo "unique_name=$UNIQUE_NAME" >> $GITHUB_OUTPUT
          echo "branch_name=submission-${UNIQUE_NAME}" >> $GITHUB_OUTPUT

      - name: Copy files to submission directory
        run: |
          cp scenario.toml submissions/${{ steps.metadata.outputs.unique_name }}.toml
          cp output/results.json results/${{ steps.metadata.outputs.unique_name }}.json
          cp output/provenance.json submissions/${{ steps.metadata.outputs.unique_name }}.provenance.json

      - name: Determine target repository
        id: target
        env:
            GH_TOKEN: ${{ github.token }}
        run: |
            PARENT_REPO=$(gh api repos/${{ github.repository }} --jq '.parent.full_name // "${{ github.repository }}"')
            echo "Target repository: $PARENT_REPO"
            echo "repo=$PARENT_REPO" >> $GITHUB_OUTPUT

      - name: Create submission branch
        run: |
          git remote add upstream https://github.com/${{ steps.target.outputs.repo }}.git
          git fetch upstream
          git checkout -b ${{ steps.metadata.outputs.branch_name }} upstream/main

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/${{ steps.metadata.outputs.unique_name }}.toml submissions/${{ steps.metadata.outputs.unique_name }}.provenance.json results/${{ steps.metadata.outputs.unique_name }}.json
          git commit -m "Submission: ${{ steps.metadata.outputs.unique_name }}

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin ${{ steps.metadata.outputs.branch_name }}
          echo "::notice title=Submission Branch Created::Your results are ready for submission on branch: ${{ steps.metadata.outputs.branch_name }}"

      - name: Output PR link
        run: |
          echo "### Submit your results" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open a pull request](https://github.com/${{ steps.target.outputs.repo }}/compare/main...${{ github.repository_owner }}:${{ github.event.repository.name }}:${{ steps.metadata.outputs.branch_name }}?expand=1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ When creating the PR, UNCHECK 'Allow edits and access to secrets by maintainers' to protect your secrets." >> $GITHUB_STEP_SUMMARY