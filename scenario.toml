[green_agent]
agentbeats_id = ""
env = {OPENAI_API_KEY = "${OPENAI_API_KEY}", NEBIUS_API_KEY = "${NEBIUS_API_KEY}", LOG_LEVEL = "INFO" }

[[participants]]
agentbeats_id = ""
name = "agent"
env = {OPENAI_API_KEY = "${OPENAI_API_KEY}", NEBIUS_API_KEY = "${NEBIUS_API_KEY}"}

[config]
domain = "corebench_hard"
num_tasks = 3
use_mcp = true
mcp_server_command = ["uv", "run", "mcp", "run", "scenarios/corebench/mcp_server.py"]
keep_traces = true 
use_cache = false